<div class="limbo-umbraco-media-picker type-converter-overlay" ng-controller="Limbo.Umbraco.MediaPicker.TypeConverterOverlay.Controller as vm">
    <umb-editor-view>
        <umb-editor-header name="model.title"
                           name-locked="true"
                           hide-alias="true"
                           hide-icon="true"
                           hide-description="true">
        </umb-editor-header>
        <umb-editor-container>
            <umb-box>
                <umb-box-content>
                    <div class="form-search" ng-if="model.filter" style="margin-bottom: 15px;">
                        <i class="icon-search"></i>
                        <input type="text"
                               ng-model="vm.searchTerm"
                               class="umb-search-field search-query input-block-level -full-width-input"
                               localize="placeholder"
                               placeholder="@placeholders_filter"
                               umb-auto-focus
                               no-dirty-check />
                    </div>
                    <div class="item" ng-repeat="item in model.availableItems | orderBy:'name' | filter:vm.searchTerm" ng-class="{obsolete: item.obsolete}">
                        <div class="umb-node-preview" ng-click="vm.select(item)" role="button">
                            <span class="label-obsolete" ng-if="item.obsolete">Obsolete</span>
                            <div class="flex">
                                <umb-icon ng-if="item.icon" icon="{{item.icon}}" class="umb-node-preview__icon"></umb-icon>
                                <div class="umb-node-preview__content">
                                    <div class="umb-node-preview__name">
                                        {{item.name}}
                                    </div>
                                    <div class="umb-node-preview__description" ng-if="item.description">{{item.description}}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </umb-box-content>
            </umb-box>
        </umb-editor-container>
        <umb-editor-footer>
            <umb-editor-footer-content-right>
                <umb-button type="button"
                            button-style="link"
                            label-key="general_close"
                            shortcut="esc"
                            action="vm.close()">
                </umb-button>
            </umb-editor-footer-content-right>
        </umb-editor-footer>
    </umb-editor-view>
</div>
